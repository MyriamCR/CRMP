
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2 Grid</title>

    <link rel="stylesheet" href="style2.css">
</head>

<body>

    <!-- Barra de arriba -->
    <div class="barra">
        <div class="controles">
            <div class="circulo rojo"></div>
            <div class="circulo amarillo"></div>
            <div class="circulo verde"></div>
        </div>
    </div>

    <!-- Contenido principal -->
    <div class="contenido">

        <!-- área izquierda -->
        <div class="izquierda"></div>

        <!-- área central -->
        <div class="centro">
            <div class="morado"></div>

            <div class="medio">
                <div class="verde-central"></div>
                <div class="apilados">
                    <div class="azul"></div>
                    <div class="lila"></div>
                </div>
            </div>

            <div class="naranja"></div>
        </div>

        <!-- área derecha -->
        <div class="derecha"></div>

    </div>

</body>
</html>
