
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1 Grid</title>

    <link rel="stylesheet" href="style1.css">
</head>

<body>

    
    <!-- Barra con puntitos-->
    <div class="barra">
       <div class="controles">
            <div class="circulo rojo"></div>
            <div class="circulo amarillo"></div>
            <div class="circulo verde"></div>
        </div>
    </div>

    <!-- Contenedor -->
    <div class="contenido">
            <!-- Área izquierda dividida en 3 filas -->
            <div class="izquierda">

                <!-- Primera fila -->
                <div class="morado"></div>
                <!-- Segunda fila -->
                <div class="fila2">
                    <div class="rojo"></div>
                    <div class="verde"></div>
                </div>
                <!-- Tercera fila -->
                <div class="fila3">
                    <div class="lila"></div>
                    <div class="naranja"></div>
                </div>

            </div>

            <!-- Área derecha -->
            <div class="azul"></div>

    </div>

    

</body>
</html>
