<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3 Grid</title>

    <link rel="stylesheet" href="style3.css">
</head>

<body>

    <!-- Barra de arriba -->
    <div class="barra">
        <div class="controles">
            <div class="circulo rojo"></div>
            <div class="circulo amarillo"></div>
            <div class="circulo verde"></div>
        </div>
    </div>

    
    <div class="contenido">

        <!-- bloque principal ara izquierda -->
        <div class="principal">
            
            <div class="morado"></div>

            <!-- area naranja izquierda y centro) -->
            <div class="inferior">
                <div class="naranja"></div>

                <div class="centro">

                    <div class="verde-central"></div>

                    <div class="azules">
                        <div class="azul"></div>
                        <div class="azul"></div>
                    </div>

                    <div class="cuadros-inferior">
                        <div class="lila"></div>
                        <div class="lila"></div>
                        <div class="rojo-bloque"></div>
                        <div class="lila"></div>
                        <div class="lila"></div>

                        <div class="lila"></div>
                        <div class="lila"></div>
                        <div class="rojo-bloque"></div>
                        <div class="lila"></div>
                        <div class="lila"></div>
                    </div>
                </div>

            </div>

        </div>

        <!-- área naranja derecha -->
        <div class="derecha"></div>

    </div>

</body>
</html>
